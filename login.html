<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>login · Mauro Brito</title>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>try{if(localStorage.getItem('mb_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(_){}</script>
  <style>
    :root{--fg:#141414;--fg2:#4a4a50;--border:rgba(0,0,0,.12);--surface:rgba(0,0,0,.04);--paper:#fdfdfb;--accent:#3478f6}
    [data-theme="dark"]{--fg:#f0f0f2;--fg2:#b8b8bc;--border:rgba(255,255,255,.14);--surface:rgba(255,255,255,.05);--paper:#0e0e10;--accent:#5a9fff}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:var(--fg);background:var(--paper);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    form{width:100%;max-width:280px}
    input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);outline:none;transition:border-color .2s}
    input:focus{border-color:var(--accent)}
    input.locked{border-color:#d33}
  </style>
</head>
<body>
  <form id="loginForm">
    <input id="pw" type="password" autocomplete="current-password" aria-label="password" required autofocus>
  </form>
  <script>
  (function(){
    const form=document.getElementById('loginForm'), pw=document.getElementById('pw');
    // only follow local paths so ?next= can't bounce anyone to another site
    let next=new URLSearchParams(location.search).get('next')||'/tool/notes';
    if(!/^\/(?!\/)/.test(next)) next='/tool/notes';

    // check the password as you type (after a short pause) and let you in
    // the moment it's right, no button needed
    let timer=null, entering=false;
    async function check(){
      if(entering||!pw.value) return;
      try{
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({password:pw.value})});
        if(r.ok){entering=true;location.replace(next);return}
        pw.classList.toggle('locked',r.status===429);
      }catch(_){}
    }
    pw.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(check,300)});
    form.addEventListener('submit',e=>{e.preventDefault();clearTimeout(timer);check()});
  })();
  </script>
</body>
</html>
